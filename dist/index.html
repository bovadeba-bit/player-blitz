<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b0c0f" />
  <title>プレイヤー</title>

  <style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #0b0c0f;
    }

    body {
      overflow: hidden;
      color: #f5f5f7;
      font-family:
        Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    #preboot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(104,65,145,.16), transparent 34%),
        #0b0c0f;
    }

    #preboot-card {
      display: grid;
      justify-items: center;
      gap: 12px;
      color: #8f9099;
      font-size: 12px;
      letter-spacing: .02em;
    }

    #preboot-mark {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(139,92,246,.35), rgba(211,106,157,.15));
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    #preboot-status {
      max-width: 360px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-jl4yyWnn.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-C71_fFBX.css">
</head>

<body>
  <div id="app">
    <div id="preboot">
      <div id="preboot-card">
        <div id="preboot-mark">プ</div>
        <strong style="color:#f5f5f7;font-size:16px">プレイヤー</strong>
        <span id="preboot-status">Loading Activity…</span>
      </div>
    </div>
  </div>

  <script>
    // If the JS bundle itself fails to arrive, never leave the user staring at
    // an unexplained white/black Activity.
    window.__PLAYER_BOOTED__ = false;

    window.addEventListener("error", function (event) {
      if (window.__PLAYER_BOOTED__) return;
      var status = document.getElementById("preboot-status");
      if (status) {
        status.textContent =
          "The player UI failed to load. Close and reopen the Activity.";
      }
      console.error("[preboot]", event.error || event.message);
    });

    window.setTimeout(function () {
      if (window.__PLAYER_BOOTED__) return;
      var status = document.getElementById("preboot-status");
      if (status) {
        status.textContent =
          "Still connecting… If this remains here, close and reopen the Activity.";
      }
    }, 10000);
  </script>

</body>
</html>
